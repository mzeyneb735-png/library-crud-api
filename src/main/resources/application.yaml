spring:
  application:
    name: library-crud-api
  datasource:
    url: jdbc:postgresql://localhost:5432/library_crud_api_db
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080